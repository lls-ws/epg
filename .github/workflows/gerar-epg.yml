name: Gerar e Publicar EPG

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Baixar programação e salvar log
        run: |
          mkdir -p lls
          npm run grab --- --channels=lls/meus-canais.xml --output=guide.xml --days=3 --maxConnections=5 --gzip | tee lls/ultimo-log.txt

      - name: Publicar guide.xml.gz e log no repositório
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f guide.xml.gz
          git add lls/ultimo-log.txt
          git commit -m "Atualiza guide.xml.gz e log de execução" || exit 0
          git push
