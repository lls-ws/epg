name: Gerar e Publicar EPG

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Baixar programação e compactar em .gz
        run: npm run grab --- --channels=meus-canais.xml --output=guide.xml --days=3 --maxConnections=5 --gzip

      - name: Publicar arquivo guide.xml.gz no repositório
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f guide.xml.gz
          git commit -m "Atualiza guide.xml.gz" || exit 0
          git push
